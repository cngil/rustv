name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the shell (Slint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: shellcheck scripts/*.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  remote:
    name: remote (browser tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tvd
      - name: Let tvd create its virtual keyboard
        run: sudo modprobe uinput && sudo chmod 666 /dev/uinput
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/remote/package-lock.json
      - working-directory: tests/remote
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: tests/remote
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remote-test-traces
          path: tests/remote/test-results
