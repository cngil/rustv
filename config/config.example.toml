# rustv configuration
#
# Copy to ~/.config/rustv/config.toml and edit. Everything rustv shows and
# does is defined here; nothing is hardcoded and nothing is fetched from the
# internet.

[server]
# Address of the API and the web remote. Keep it on your LAN or a VPN such
# as Tailscale; never forward this port to the internet.
bind = "0.0.0.0:8765"
# token_file = "/home/you/.config/rustv/token"   # default: next to this file
# pairing_address = "auto"   # auto: <hostname>.local when Avahi runs, else the IP; or "ip", "hostname"

[browser]
# Opens "web" apps. {url} is replaced with the app URL.
command = ["flatpak", "run", "org.mozilla.firefox", "--kiosk", "{url}"]

[audio]
step = 0.05        # 5% per volume press
max_volume = 1.0   # 100%; above that PipeWire boosts in software, which can distort
per_app_volume = true   # each app (and the home screen) keeps its own volume

[shell]
# What the on-screen home screen shows. Everything is on by default.
greeting = true
clock = true
date = true
volume_overlay = true   # volume bar when the volume changes
pairing_qr = true       # QR code for pairing a phone, until one pairs and on request
sounds = true           # soft sounds when moving between apps and opening one
sound_volume = 0.5      # 0..1, on top of the TV volume

[screensaver]
# Starts after a while on the home screen without input; any key wakes the TV.
# Generated on the box: no images, no network. The clock drifts slowly so
# nothing burns into the panel.
enabled = true
idle_minutes = 5
style = "random"   # random (a different one each time), aurora, orbits, clock or images
clock = true
date = true

[wallpaper]
# Your own pictures (JPEG or PNG), files or folders of them. They show behind
# the home screen and in the "images" screensaver; "random" mixes them with
# the generated styles. Only these files are ever served, and only to the shell.
images = []   # for example ["~/Pictures/tv", "/srv/photos/sea.jpg"]
home = true            # behind the home screen (with no images: the theme's gradient)
change_minutes = 30    # how often the home picture changes
slide_seconds = 30     # how long each picture stays in the screensaver
shuffle = true         # random order instead of the listed one

[cast]
# AirPlay receiver: iPhones, iPads and Macs can mirror their screen or play
# video and music on the TV. Needs uxplay and avahi-daemon (see the README).
airplay = false
name = "rustv"      # shown in the sender's Screen Mirroring list
# extra_args = ["-vd", "avdec_h264"]   # more UxPlay options, here: software decoding

[gamepad]
# A gamepad works as the remote on the home screen: D-pad or left stick to
# move, A to open, B back, shoulder buttons for volume. Inside apps the
# gamepad is the app's (games, Moonlight); only Guide still does something.
enabled = true
guide_closes_app = true   # the Xbox / PS button closes the open app

[theme]
# Colors of the TV and the remote: a metal finish on graphite. Presets:
# silver, titanium, champagne, gunmetal (the old color presets still load,
# as silver; graphite as gunmetal). Any of the three colors below replaces
# the finish's own; backgrounds must be dark (text is light).
preset = "silver"
# accent = "#c9ced4"         # the lit plate: focused tile, OK, switches that are on
# accent_2 = "#eceff2"       # a plate being pressed
# background = "#0e1013"

[locale]
# Language of the TV, the remote and the overlay, and how numbers look.
language = "en"            # en or tr
clock = "24h"              # 24h or 12h
temperature = "celsius"    # celsius or fahrenheit (debug overlay)

[lock]
# Household lock: with a PIN set (in the remote's settings), the TV can be
# locked so nothing works until the PIN is entered on a remote. The PIN is
# kept hashed in ~/.local/state/rustv/lock, never in this file.
on_sleep = false   # lock when the TV goes to sleep

[sleep]
# After this long without remote input and without sound, the screen turns
# off and the open app closes. Any button on the remote wakes the TV. The box
# stays on (a suspended box would drop off the network, remote included).
enabled = true
after_minutes = 60
close_apps = true   # frees the app's memory and CPU

[cec]
# HDMI-CEC through the kernel (/dev/cec*). Off by default: most PC graphics
# cards have no CEC. A Raspberry Pi, some NUCs, DisplayPort adapters with CEC
# tunneling and the Pulse-Eight USB adapter (inputattach --pulse8-cec) do.
# Your user needs access to the device, usually through the "video" group.
enabled = false
# device = "/dev/cec0"   # unset: the first adapter found
name = "rustv"           # what the TV calls this input, up to 14 characters
power_tv = true          # wake turns the TV on and switches to rustv, sleep turns it off
follow_tv = true         # TV off puts rustv to sleep, TV switched to rustv wakes it
remote_keys = true       # the TV remote's arrows, OK, Back, play and volume work

[overlay]
# Debug overlay: one line of live stats over everything on the TV, drawn by
# swaybar. Switch it in Settings in the remote or through the API at any time.
enabled = false
position = "top"                # top or bottom
font = "DejaVu Sans Mono 14"    # Pango font description
interval_ms = 1000              # refresh rate, at least 250
# Shown in this order; leave out what you do not need.
#   app, cpu, gpu, ram, net, wifi, display, volume, remotes, uptime, clock
items = ["app", "cpu", "gpu", "ram", "net", "wifi", "display", "volume", "remotes", "uptime"]

# Apps, in the order they appear. Three kinds:
#   flatpak: app_id (+ optional args)
#   command: any program, as a list of arguments
#   web:     a URL, opened full screen in the browser above
# Optional on every app:
#   description = "Shown in the remote"
#   icon = "~/.local/share/icons/my-app.svg"   (SVG, PNG or JPEG; Flatpak apps use their own icon)
#   env = { NAME = "value" }

[[app]]
id = "jellyfin"
name = "Jellyfin"
description = "Movies and shows"
kind = "flatpak"
app_id = "org.jellyfin.JellyfinDesktop"
args = ["--tv", "--fullscreen"]

[[app]]
id = "stremio"
name = "Stremio"
kind = "flatpak"
app_id = "com.stremio.Stremio"

[[app]]
id = "moonlight"
name = "Moonlight"
description = "Stream games from your PC"
kind = "flatpak"
app_id = "com.moonlight_stream.Moonlight"

[[app]]
id = "browser"
name = "Browser"
kind = "web"
url = "about:home"
icon = "/var/lib/flatpak/exports/share/icons/hicolor/128x128/apps/org.mozilla.firefox.png"

[[app]]
id = "qbittorrent"
name = "qBittorrent"
description = "Downloads"
kind = "web"
url = "http://localhost:8080"

