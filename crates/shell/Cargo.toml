[package]
name = "rustv-shell"
description = "rustv on-screen shell: the TV home screen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Already in the tree through Slint; decodes and scales wallpapers.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.8", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
toml = "0.8"
ureq = { version = "2", default-features = false }

[build-dependencies]
slint-build = "1.8"
