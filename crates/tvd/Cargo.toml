[package]
name = "tvd"
description = "rustv daemon: launches TV apps, injects remote input, exposes a local API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
rustv-locales = { path = "../locales" }
axum = { version = "0.7", features = ["ws"] }
evdev = { version = "0.12", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "net", "fs"] }
toml = "0.8"
# Already in the tree through `toml`; edits config.toml without losing comments.
toml_edit = "0.22"
qrcode = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
