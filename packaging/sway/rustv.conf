# sway as a TV kiosk for rustv: the shell fills the screen and every app
# opens full screen on top of it. Copy to ~/.config/rustv/sway.conf and
# adjust the output section to your TV.

# Output. Many 4K TVs only offer 4K at 30 Hz over HDMI 1.4; 1080p at 60 Hz
# is smoother and keeps app interfaces readable. List modes with `swaymsg -t get_outputs`.
# This is the mode at login; a mode picked in rustv's settings (display.mode) replaces it.
output HDMI-A-1 mode 1920x1080@60Hz
output eDP-1 disable

# No X11, no decorations, no bars, no keybindings: nothing but the apps.
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
focus_on_window_activation focus

# The pointer only shows up while it is being used.
seat * hide_cursor 3000

# Apps open full screen; when they close, the shell is the only window left.
for_window [app_id=".*"] fullscreen enable

# Keep the shell running even if it crashes.
exec sh -c 'while true; do "$HOME/.local/bin/rustv-shell"; sleep 1; done'
